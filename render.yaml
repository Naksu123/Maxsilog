services:
  - type: web
    name: autovaluate-api
    runtime: python
    region: singapore
    plan: free
    branch: main
    buildCommand: "pip install --upgrade pip && pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: ADMIN_API_KEY
        value: admin123!s01
      - key: PYTHONPATH
        value: .
