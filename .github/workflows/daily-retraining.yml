name: AutoValuate Daily ML Retraining

on:
  # Daily at 02:00 AM Malaysia Time (Asia/Kuala_Lumpur, UTC+8) -> 18:00 UTC previous day
  schedule:
    - cron: '0 18 * * *'
  # Manual on-demand execution via GitHub Actions UI
  workflow_dispatch:
    inputs:
      force_retrain:
        description: 'Force retraining even if dataset SHA-256 checksum is unchanged'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  daily-retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute Daily Retraining Pipeline
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend:${{ github.workspace }}/backend/ml
        run: |
          if [ "${{ github.event.inputs.force_retrain }}" = "true" ]; then
            python -m backend.ml.scheduler --run-now --force
          else
            python -m backend.ml.scheduler --run-now
          fi

      - name: Run Validation Test Suite
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend:${{ github.workspace }}/backend/ml
        run: |
          pytest backend/tests -v

      - name: Commit & Push Retrained Model Artifacts and Manifests
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "AutoValuate ML Bot"
          git add backend/models/
          git diff --staged --quiet || git commit -m "Auto-retrain: Daily model candidate evaluation & version manifest [skip ci]"
          git push origin HEAD:${{ github.ref }} || echo "No changes to commit or remote updated"
