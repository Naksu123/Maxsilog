<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Studio Canvas -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Studio Pedestal Floor Glow -->
  <ellipse cx="400" cy="360" rx="320" ry="40" fill="url(#glowGrad)"/>
  <ellipse cx="400" cy="355" rx="260" ry="2" fill="#38bdf8" opacity="0.4"/>

  <!-- Grid Horizon Lines -->
  <line x1="80" y1="360" x2="720" y2="360" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="140" y1="380" x2="660" y2="380" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Automotive Silhouette Geometry -->
  <g transform="translate(0, 40)">
    <!-- Cabin Greenhouse Glass -->
    <path d="M 280 235 L 340 165 C 360 145, 480 145, 520 165 L 590 235 Z" 
          fill="#0c1322" stroke="#38bdf8" stroke-width="2" opacity="0.85"/>
    
    <!-- Window Pillars (A, B, C Pillars) -->
    <line x1="430" y1="150" x2="430" y2="235" stroke="#1e293b" stroke-width="3"/>
    
    <!-- Vehicle Body Aerodynamic Contour -->
    <path d="M 150 270 
             C 150 260, 180 245, 230 240
             C 270 235, 330 165, 360 150
             C 410 140, 500 140, 550 155
             C 580 170, 630 235, 670 245
             C 710 255, 730 265, 730 275
             C 730 290, 710 300, 680 300
             L 640 300
             C 630 265, 570 265, 560 300
             L 320 300
             C 310 265, 250 265, 240 300
             L 170 300
             C 150 300, 150 280, 150 270 Z" 
          fill="none" stroke="url(#carGrad)" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Headlight & Taillight Beams -->
    <line x1="710" y1="262" x2="728" y2="265" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round"/>
    <line x1="152" y1="262" x2="165" y2="262" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>

    <!-- Front & Rear Wheels -->
    <circle cx="280" cy="300" r="38" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="280" cy="300" r="22" fill="#020617" stroke="#64748b" stroke-width="2"/>
    <circle cx="280" cy="300" r="6" fill="#38bdf8"/>

    <circle cx="600" cy="300" r="38" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="600" cy="300" r="22" fill="#020617" stroke="#64748b" stroke-width="2"/>
    <circle cx="600" cy="300" r="6" fill="#38bdf8"/>
  </g>

  <!-- Typography Labeling -->
  <text x="400" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="2">
    AUTOVALUATE AUTOMOTIVE DATA INTELLIGENCE
  </text>
  <text x="400" y="425" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle" opacity="0.8">
    NEUTRAL VEHICLE SPECIFICATION REFERENCE
  </text>
</svg>

